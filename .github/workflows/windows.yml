name: Build Windows
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified Windows release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and verify
        shell: pwsh
        run: ./Windows/scripts/package.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: MacPet-${{ matrix.runtime }}
          path: |
            dist/*windows-*.zip
            dist/*windows-*.sha256
            Windows/test-results/**
          if-no-files-found: error
  release:
    if: inputs.publish
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: windows-artifacts
          merge-multiple: true
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = @(Get-ChildItem windows-artifacts -Recurse -File | Where-Object { $_.Name -match '^MacPet-1\.2\.2-windows-(x64|arm64)\.zip(\.sha256)?$' } | ForEach-Object FullName)
          if ($Assets.Count -ne 4) { throw 'Expected two Windows archives and two SHA-256 files' }
          gh release create windows-v1.2.2 --target $env:GITHUB_SHA --title 'MacPet Windows 1.2.2 · 原生 Windows 适配' --notes-file Windows/RELEASE.md --latest=false @Assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
